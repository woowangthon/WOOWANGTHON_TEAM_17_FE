<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="충북 여행 계획에서 여행방을 만들고 초대 코드로 함께하는 여행을 시작하세요."><title>충북 여행 계획 | 여행의 시작</title><link rel="stylesheet" href="/assets/live-entry/entry.css"><script>if(new URLSearchParams(location.search).get("preview")==="ui"){location.replace("./ui-preview.html?preview=ui")}</script></head><body><div class="shell"><header class="site-header" aria-hidden="true"></header><main><div class="masthead"><h1 class="brand-title">충북 여행 계획</h1><p class="intro">여행방을 만들거나 초대 코드로 참여하세요.</p></div><div class="entry-layout"><figure class="gallery" id="gallery" aria-label="충북 관광지 사진 슬라이드"><div class="image-stage"><img id="place-photo" src="/assets/live-entry/d6d2c1968c7aab1a.jpg" alt="도담삼봉" fetchpriority="high"></div><figcaption class="photo-caption"><div class="place-meta"><span class="place-city" id="place-city">단양군</span><p class="place-name" id="place-name">도담삼봉</p></div><div class="slide-controls" aria-label="관광지 사진 조작"><span class="slide-count" id="slide-count">01 / 12</span><button id="slide-prev" type="button" aria-label="이전 사진"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button><button id="slide-toggle" type="button" aria-label="사진 자동 넘김 일시정지"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button><button id="slide-next" type="button" aria-label="다음 사진"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></svg></button></div></figcaption><div class="thumbnail-rail" id="thumbnail-rail" role="group" aria-label="여행지 사진 골라 보기"></div><span class="sr-only" id="slide-announcement" aria-live="polite"></span></figure><section class="entry-form-area" aria-label="여행 시작"><div class="tabs" role="tablist" aria-label="여행 시작 방법"><button id="create-tab" role="tab" aria-selected="true" aria-controls="form-panel" data-tab="create">새 여행 만들기</button><button id="join-tab" role="tab" aria-selected="false" aria-controls="form-panel" data-tab="join" tabindex="-1">초대 코드로 참여</button></div><div id="form-panel" role="tabpanel" aria-labelledby="create-tab"><h2 class="form-title">우리 여행방 만들기</h2><p class="form-description">방을 만들면 함께할 사람을 초대할 수 있어요.</p><form id="entry-form"><div class="fields"><div class="field"><div class="field-top"><label for="trip-name">여행방 이름</label><span class="hint" id="name-hint">최대 40자</span></div><input id="trip-name" name="name" placeholder="예: 단양으로 가는 주말" maxlength="80" required autocomplete="off" aria-describedby="name-hint"></div><div class="field"><div class="field-top"><label for="nickname">내 닉네임</label><span class="hint" id="nickname-hint">최대 20자</span></div><input id="nickname" name="nickname" placeholder="여행에서 사용할 이름" maxlength="40" required autocomplete="nickname" aria-describedby="nickname-hint"></div></div><p id="entry-error" class="form-error" role="alert"></p><button class="primary" id="entry-submit" type="submit"><span>여행방 만들기</span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button><p class="flow-note">초대 코드는 다음 화면에서 복사할 수 있어요.</p></form><noscript><p>방 생성과 참여 기능을 사용하려면 JavaScript를 켜 주세요.</p></noscript></div><details class="entry-help"><summary>초대 코드로 어떻게 참여하나요?</summary><p>여행방을 만든 사람에게 코드를 받아 ‘초대 코드로 참여’에 입력하면 돼요. 방 정보는 공용 DB에 저장돼요.</p></details></section></div></main></div><script type="module" src="/assets/live-entry/entry.js"></script></body></html>
